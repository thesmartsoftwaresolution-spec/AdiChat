<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#004327">
  <title>AdiChat — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fcf8f8;color:#1c1b1b;font-family:Inter,system-ui,sans-serif}
    main{width:min(100%,420px);text-align:center;background:#fff;border:1px solid #e5e2e1;border-radius:24px;padding:32px;box-shadow:0 12px 36px #00211112}
    img{width:64px;height:64px}h1{font-size:22px;margin:18px 0 8px}p{font-size:14px;line-height:1.6;color:#404942;margin:0 0 22px}
    button{border:0;border-radius:12px;padding:12px 18px;background:#004327;color:#fff;font-weight:600;font-size:14px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/adichat.svg" alt="">
    <h1>You're offline</h1>
    <p>AdiChat needs an internet connection to securely load your chats and AI assistants. Your private messages are not stored for offline access.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
